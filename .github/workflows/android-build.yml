name: Android build

# Builds the Capacitor-wrapped frontend into an installable Android APK, and
# (only once RELEASE_KEYSTORE_BASE64 is set as a repo secret) a signed AAB
# ready for the Play Store. Runs entirely on GitHub's hosted runner — nothing
# needs to be installed locally to produce either artifact.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        # chmod defensively: git on Windows (where this repo's android/
        # folder was generated) doesn't preserve the Unix executable bit,
        # so gradlew may arrive non-executable on the Linux runner.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # --- Signed release build (Play Store) ---
      # Only runs once these repo secrets exist (Settings -> Secrets and
      # variables -> Actions): RELEASE_KEYSTORE_BASE64 (base64 of your .jks
      # file), RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        working-directory: frontend/android/app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build signed release AAB
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        working-directory: frontend/android
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
